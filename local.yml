---
- name: Update Linux
  hosts: localhost
  connection: local
  # Running as root
  tasks:
    - name: Run equivalent of "apt-get update"
      ansible.builtin.apt:
        update_cache: yes
    - name: Update all packages to latest version
      ansible.builtin.apt:
        name: "*"
        state: latest
    - name: Run equivalent of "apt full-upgrade"
      ansible.builtin.apt:
        upgrade: full
    - name: Autoremove dependenices and autoclean cache
      ansible.builtin.apt:
        autoremove: yes
        autoclean: yes
#reboot when host reboots
