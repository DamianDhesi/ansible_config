---
- name: Bootstrap Setup
  hosts: localhost
  connection: local
  # Running as root
  tasks:
    # Will need to install ansible-core (includes python3) and git manually first
    - name: Set timezone
      ansible.builtin.command: "timedatectl set-timezone America/Los_Angeles"
    - name: Install cron
      ansible.builtin.apt:
        name: cron
        state: present
    - name: Install logrotate
      ansible.builtin.apt:
        name: logrotate
        state: present