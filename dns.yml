---
- name: Run Linux update play
  ansible.builtin.import_playbook: update/update_linux.yml

- name: Update Technitium DNS
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Update Technitium
      ansible.builtin.shell: "curl -sSL https://download.technitium.com/dns/install.sh | bash"
    - name: Trigger delayed reboot
      ansible.builtin.shell: "sleep 10 && reboot"
      async: 20
      poll: 0
    - name: End playbook
      ansible.builtin.meta: end_play
